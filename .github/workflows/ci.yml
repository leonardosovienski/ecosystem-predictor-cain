name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  # O drift não precisa de um push para acontecer: basta outro repositório se mover.
  # Em 2026-09-06 o estado canônico estava três dias defasado sem nenhum commit aqui.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: read

env:
  # Stack wheels and cross-repository reads: the product repositories are private. STACK_READ_TOKEN is a
  # fine-grained token with Contents: read on the nine repositories; GITHUB_TOKEN only reaches this repository
  # (enough for packages/research-transport, whose wheel is published here; not for compat/ nor the drift checks).
  STACK_READ_TOKEN: ${{ secrets.STACK_READ_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  research-packages:
    # Cada pacote de packages/* tem uv.lock próprio e é testado pelo lock em
    # todas as versões de Python que declara (requires-python >=3.11).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        package: [research-snapshot, research-bundle, research-protocol, research-transport]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
      - name: Stack wheels from the registry (research-transport consumes the published protocol wheel)
        if: matrix.package == 'research-transport'
        run: uv run --no-project python ../../scripts/stack_wheels.py fetch --project .
      - run: uv lock --check
      - run: uv sync --locked --no-editable
      - if: matrix.package == 'research-transport'
        run: uv run --no-project python ../../scripts/stack_wheels.py check --project .
      - run: uv run --locked --no-sync pytest tests -q
      - if: matrix.package == 'research-bundle'
        run: uv run --locked --no-sync python -I -c "import research_bundle; from importlib.resources import files; assert files('research_bundle').joinpath('contract.json').read_bytes()"
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.python }}
          path: packages/${{ matrix.package }}/dist/*.whl
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pyright
      - run: uv run --no-sync coverage run -m pytest tests packages/research-snapshot/tests packages/research-bundle/tests -q
      - run: uv run --no-sync coverage report --fail-under=75
      - name: Current project representation (reads the other private repositories with STACK_READ_TOKEN)
        if: matrix.python == '3.13'
        env:
          GITHUB_TOKEN: ${{ secrets.STACK_READ_TOKEN || github.token }}
        run: uv run --locked python scripts/check_current_representation.py
      - name: Historical six-repository facts remain internally consistent
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/sync_canonical_ecosystem_facts.py --offline-check
      - name: Registries are internally consistent
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/check_ecosystem_drift.py --offline-check
      - run: uv build
      - run: uv build --directory packages/research-snapshot --out-dir ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
      - name: wheel smoke outside checkout
        run: |
          uv venv /tmp/ecosystem-wheel --python ${{ matrix.python }} --seed
          /tmp/ecosystem-wheel/bin/pip install dist/*.whl
          /tmp/ecosystem-wheel/bin/python -c "import ecosystem.contracts; import ecosystem.registry"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with: {path: ".", output-file: "sbom.spdx.json", upload-release-assets: false}

  ecosystem-drift:
    name: Seven-project immutable compatibility manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_architecture_manifest.py
        env:
          GITHUB_TOKEN: ${{ secrets.STACK_READ_TOKEN || github.token }}


  joint-install:
    # Lock CONJUNTA (compat/uv.lock): CAIN + os três domínios + core/ops/transporte, por sha256 (compat/STACK_WHEELS.json), numa só
    # resolução de terceiros (achado E-1 da validação de 2026-09-29). Prova que o "ecossistema instalado junto"
    # é reproduzível por lock, sem resolver nada do PyPI na hora.
    name: Joint lock installs CAIN and the three domains together
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compat
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Stack wheels from the registry (ten published wheels, sha256-verified; needs STACK_READ_TOKEN)
        run: python ../scripts/stack_wheels.py fetch --project .
      - run: uv lock --check
      - run: uv sync --locked
      - run: python ../scripts/stack_wheels.py check --project .
      - run: uv run --locked --no-sync python -I -c "import cain, research_transport, research_protocol, GarimpoInvestimentos.adapters.research_v2, brasileirao_predictor.adapters.research_v2, stocks_predictor; print('joint import ok')"
      - run: uv run --locked --no-sync predictor-research-consumer --help
      - run: uv run --locked --no-sync cain research --help
