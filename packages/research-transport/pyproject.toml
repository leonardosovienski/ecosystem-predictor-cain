[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-research-transport"
version = "0.1.0rc7"
description = "Local file spool and per-domain consumer for the V2 research envelope (Stage B); no scheduling, no capital"
requires-python = ">=3.11"
dependencies = ["predictor-research-protocol==2.0.0rc2"]

[project.scripts]
predictor-research-consumer = "research_transport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# predictor-research-protocol: the published wheel registered in STACK_WHEELS.json, fetched into this flat index by
# `python ../../scripts/stack_wheels.py fetch --project .` (sha256-verified; never versioned).
[[tool.uv.index]]
name = "stack-wheels"
url = ".stack-wheels"
format = "flat"

[dependency-groups]
dev = ["pytest>=8.4,<10"]
