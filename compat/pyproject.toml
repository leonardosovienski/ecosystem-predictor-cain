# Lock CONJUNTA do ecossistema (achado E-1 da validação de 2026-09-29): um único ambiente, com hashes, em que
# o CAIN e os três domínios instalam juntos com as wheels publicadas do stack fixadas por URL + sha256 e uma só
# resolução de terceiros. Não é um pacote: é o `uv.lock` que descreve o "ecossistema instalado junto"
# (um consumidor `predictor-research-consumer` servindo os adapters de cripto, brasileirão e stocks).
# Os domínios continuam sem dependência do envelope (D-13); quem depende do transporte é o CAIN.
# Verificado no CI (job `joint-install`): `uv sync --locked` + import dos três adapters e do consumidor.
# Só as dependências base de cada wheel entram (é o que o caminho adapter → runtime de pesquisa usa, como no
# contract test do cripto); extras como `v3` (ccxt) e `llm` ficam fora — o conflito certifi/idna do E-1 vinha do ccxt.
# Resolução de 2026-09-29: 42 pacotes; certifi 2026.7.22, idna 3.20, typing-inspection 0.4.4, numpy 2.5.3, pydantic 2.13.5.
[project]
name = "ecosystem-compat"
version = "0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cain-research==0.4.13rc16",
  "cripto-predictor==1.2.0rc4",
  "brasileirao-predictor==0.3.0rc5",
  "stocks-predictor==0.3.0rc3",
  "predictor-core==3.2.1",
  "predictor-ops==4.2.2rc1",
  "predictor-research-protocol==2.0.0rc2",
  "predictor-research-transport==0.1.0rc7",
  "predictor-research-snapshot==1.0.2rc1",
  "predictor-research-bundle==1.0.1rc1",
]

[tool.uv]
package = false

# The ten stack wheels are registered in STACK_WHEELS.json (repository, release tag, asset, sha256) and fetched into
# this flat index by `python ../scripts/stack_wheels.py fetch --project .` (GitHub API, private repositories need
# STACK_READ_TOKEN). The lock pins them by name + version to the index; no URL, so a rename or a visibility change
# of a producer fails in the fetch step with the reason instead of leaving a 404 in the lock (R01, 2026-10-07).
[[tool.uv.index]]
name = "stack-wheels"
url = ".stack-wheels"
format = "flat"
